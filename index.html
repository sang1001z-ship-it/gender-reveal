<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gender Reveal</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b10;
      color: #fff;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    }

    .wrap {
      width: 92vw;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
    }

    .hint {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 12px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-image: url("assets/ultrasound.jpg");
      background-size: cover;
      background-position: center;
      border-radius: 16px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 56px;
      font-weight: 900;
      background: rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .overlay.show {
      opacity: 1;
    }

    button {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #2a6bff;
      color: white;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Gender Reveal</h1>
    <div class="hint" id="hint">Start 버튼을 눌러주세요</div>

    <div class="stage">
      <canvas id="scratch"></canvas>
      <div class="overlay" id="overlay">🎉</div>
    </div>

    <button id="start">Start</button>
  </div>

  <script>
    const canvas = document.getElementById("scratch");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("start");
    const hint = document.getElementById("hint");
    const overlay = document.getElementById("overlay");

    let enabled = false;
    let scratching = false;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      ctx.fillStyle = "#bdbdbd";
      ctx.fillRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "#555";
      ctx.font = "24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("여기를 긁어보세요", rect.width / 2, rect.height / 2);
    }

    function scratch(x, y) {
      if (!enabled) return;
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.fill();
    }

    canvas.addEventListener("mousedown", e => {
      scratching = true;
      scratch(e.offsetX, e.offsetY);
    });

    canvas.addEventListener("mousemove", e => {
      if (scratching) scratch(e.offsetX, e.offsetY);
    });

    canvas.addEventListener("mouseup", () => scratching = false);

    canvas.addEventListener("touchstart", e => {
      scratching = true;
      const t = e.touches[0];
      const r = canvas.getBoundingClientRect();
      scratch(t.clientX - r.left, t.clientY - r.top);
    });

    canvas.addEventListener("touchmove", e => {
      e.preventDefault();
      if (!scratching) return;
      const t = e.touches[0];
      const r = canvas.getBoundingClientRect();
      scratch(t.clientX - r.left, t.clientY - r.top);
    }, { passive: false });

    canvas.addEventListener("touchend", () => scratching = false);

    startBtn.addEventListener("click", () => {
      enabled = true;
      hint.textContent = "손가락으로 긁어보세요 👶";
    });

    resize();
    window.addEventListener("resize", resize);
  </script>
</body>
</html>
