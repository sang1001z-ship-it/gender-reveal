<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gender Reveal</title>
  <style>
    :root { --cardW: min(92vw, 420px); }
    body{
      margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
      background:#0b0b10; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      padding:18px;
    }
    .wrap{ width: var(--cardW); text-align:center; }
    h1{ margin: 0 0 10px; font-size: 22px; font-weight: 800; letter-spacing: .2px;}
    .sub{ opacity:.85; margin:0 0 14px; font-size: 14px; line-height: 1.4;}
    .panel{
      border-radius: 18px; overflow:hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,.45);
      background: #12121a;
      border: 1px solid rgba(255,255,255,.08);
    }
    .stage{
      position:relative; width:100%;
      aspect-ratio: 4 / 3; 
      background:#000;
    }
    canvas{
      width:100%; height:100%; display:block;
      touch-action: none; 
    }
    .overlay{
      position:absolute; inset:0; display:flex; justify-content:center; align-items:center;
      background: rgba(0,0,0,.35);
      opacity:0; pointer-events:none;
      transition: opacity .2s ease;
      font-size: 64px; font-weight: 900; letter-spacing: 2px;
      text-shadow: 0 12px 28px rgba(0,0,0,.55);
    }
    .overlay.show{ opacity:1; }
    .controls{ padding:14px; display:flex; gap:10px; justify-content:center; }
    button{
      border:0; padding:12px 14px; border-radius: 12px;
      background: #2a6bff; color:#fff; font-weight: 800; font-size: 15px;
      cursor:pointer;
    }
    button.secondary{ background: rgba(255,255,255,.12); }
    .countdown{
      font-size: 44px; font-weight: 900; padding: 14px 0 6px;
      display:none;
    }
    .hint{ opacity:.8; font-size: 13px; padding-bottom: 12px; }
    .footer{ opacity:.7; font-size: 12px; margin-top: 10px; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Gender Reveal</h1>
    <p class="sub">Start를 누르고 카운트다운 후, 위를 손가락으로 긁어보세요 👶✨</p>

    <div class="panel">
      <div class="countdown" id="countdown">3</div>
      <div class="hint" id="hint">아직 시작 전이에요</div>

      <div class="stage">
        <canvas id="scratch"></canvas>
        <div class="overlay" id="overlay">🎉</div>
      </div>

      <div class="controls">
        <button id="startBtn">Start</button>
        <button class="secondary" id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="footer">Tip: 모바일에서 잘 되도록 터치/드래그 모두 지원합니다.</div>
  </div>

<script>
(() => {
  const REVEAL_IMAGE_URL = "assets/ultrasound.jpg"; 

  const canvas = document.getElementById("scratch");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  const countdownEl = document.getElementById("countdown");
  const hintEl = document.getElementById("hint");
  const overlayEl = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const resetBtn = document.getElementById("resetBtn");

  let img = new Image();
  img.src = REVEAL_IMAGE_URL;

  let isScratching = false;
  let enabled = false;
  let brushRadius = 24; 

  function resizeCanvasToDisplaySize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width * dpr));
    const h = Math.max(1, Math.floor(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  function drawCover() {
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    g.addColorStop(0, "#cfcfd6");
    g.addColorStop(1, "#9ea0aa");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.font = `${Math.floor(canvas.width / 14)}px system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("여기를 긁어보세요", canvas.width / 2, canvas.height / 2);

    overlayEl.classList.remove("show");
  }

  function setStageBackground() {
    canvas.parentElement.style.backgroundImage = `url('${REVEAL_IMAGE_URL}')`;
    canvas.parentElement.style.backgroundSize = "cover";
    canvas.parentElement.style.backgroundPosition = "center";
  }

  function scratchAt(clientX, clientY) {
    if (!enabled) return;

    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const x = (clientX - rect.left) * dpr;
    const y = (clientY - rect.top) * dpr;

    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(x, y, brushRadius * dpr, 0, Math.PI * 2);
    ctx.fill();
  }

  function percentCleared() {
    const { width:w, height:h } = canvas;
    const step = 8;
    const imageData = ctx.getImageData(0, 0, w, h).data;
    let cleared = 0, total = 0;
    for (let y = 0; y < h; y += step) {
      for (let x = 0; x < w; x += step) {
        const i = (y * w + x) * 4 + 3; // alpha
        total++;
        if (imageData[i] === 0) cleared++;
      }
    }
    return cleared / total;
  }

  function maybeFinish() {
    const p = percentCleared();
    if (p > 0.55) { 
      overlayEl.classList.add("show");
      hintEl.textContent = "BOY! 🎉";
    } else {
      hintEl.textContent = "계속 긁어보세요 🙂";
    }
  }

  function startCountdown() {
    enabled = false;
    let n = 3;
    countdownEl.style.display = "block";
    countdownEl.textContent = n;
    hintEl.textContent = "준비 중…";

    const timer = setInterval(() => {
      n--;
      if (n <= 0) {
        clearInterval(timer);
        countdownEl.style.display = "none";
        enabled = true;
        hintEl.textContent = "손가락으로 드래그해서 긁어보세요!";
      } else {
        countdownEl.textContent = n;
      }
    }, 900);
  }

  function init() {
    resizeCanvasToDisplaySize();
    setStageBackground();
    drawCover();
    enabled = false;
    hintEl.textContent = "Start를 눌러주세요";
  }

  function onDown(e) {
    if (!enabled) return;
    isScratching = true;
    const p = getPoint(e);
    scratchAt(p.x, p.y);
  }
  function onMove(e) {
    if (!isScratching) return;
    e.preventDefault();
    const p = getPoint(e);
    scratchAt(p.x, p.y);
  }
  function onUp() {
    if (!isScratching) return;
    isScratching = false;
    maybeFinish();
  }

  function getPoint(e) {
    if (e.touches && e.touches[0]) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove, { passive: false });
  window.addEventListener("mouseup", onUp);

  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp);

  startBtn.addEventListener("click", () => {
    init();          
    startCountdown();
  });

  resetBtn.addEventListener("click", () => {
    init();
  });

  window.addEventListener("resize", () => {
    const wasEnabled = enabled;
    init();
    enabled = wasEnabled;
  });

  img.onload = init;
  img.onerror = () => {
    hintEl.textContent = "이미지를 불러오지 못했어요. assets/ultrasound.jpg 경로를 확인하세요.";
    init();
  };
})();
</script>
</body>
</html>
