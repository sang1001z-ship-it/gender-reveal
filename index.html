<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gender Reveal</title>

  <style>
    :root { --max: 440px; }
    body{
      margin:0; min-height:100vh;
      display:flex; justify-content:center; align-items:center;
      background:#0b0b10; color:#fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding:18px;
    }
    .wrap{ width:min(92vw, var(--max)); text-align:center; }
    h1{ margin:0 0 8px; font-size:22px; font-weight:900; }
    .sub{ margin:0 0 14px; font-size:14px; opacity:.85; }

    .card{
      background:#12121a;
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 16px 50px rgba(0,0,0,.45);
    }

    .topbar{ padding:12px 14px 6px; }
    .countdown{
      font-size:44px; font-weight:900; display:none;
    }
    .hint{ font-size:13px; opacity:.85; padding-bottom:8px; }

    .stage{
      position:relative;
      width:100%;
      aspect-ratio: 4 / 3;
      background:#000; /* image set by JS */
    }
    canvas{
      width:100%; height:100%; display:block;
      touch-action:none;
    }

    .overlay{
      position:absolute; inset:0;
      display:flex; justify-content:center; align-items:center;
      font-size:64px; font-weight:900;
      background:rgba(0,0,0,.25);
      opacity:0; pointer-events:none;
      transition:opacity .25s ease;
    }
    .overlay.show{ opacity:1; }

    /* Text shown under the image */
    .result{
      padding:16px 12px 6px;
      font-size:28px;
      font-weight:900;
      letter-spacing:.5px;
      color:#6fa8ff;
      display:none;
    }
    .result.show{ display:block; }

    .controls{
      display:flex; gap:10px; justify-content:center; padding:14px;
    }
    button{
      border:0; border-radius:12px;
      padding:12px 14px;
      font-size:15px; font-weight:900;
      cursor:pointer; color:#fff;
      background:#2a6bff;
    }
    button.secondary{ background:rgba(255,255,255,.12); }

    .foot{ margin-top:10px; font-size:12px; opacity:.65; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Gender Reveal</h1>
    <p class="sub">Press Start, wait for the countdown, then scratch the screen 👶✨</p>

    <div class="card">
      <div class="topbar">
        <div class="countdown" id="countdown">3</div>
        <div class="hint" id="hint">Press Start</div>
      </div>

      <div class="stage" id="stage">
        <canvas id="scratch"></canvas>
        <div class="overlay" id="overlay">🎉</div>
      </div>

      <!-- Result text below the image -->
      <div class="result" id="resultText">It’s a BOY! 💙</div>

      <div class="controls">
        <button id="startBtn">Start</button>
        <button class="secondary" id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="foot">Tip: If sharing publicly, consider cropping personal info from the ultrasound image.</div>
  </div>

<script>
(() => {
  const IMAGE_URL = "assets/ultrasound.jpg";

  const canvas = document.getElementById("scratch");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const stage = document.getElementById("stage");
  const countdownEl = document.getElementById("countdown");
  const hintEl = document.getElementById("hint");
  const overlayEl = document.getElementById("overlay");
  const resultText = document.getElementById("resultText");
  const startBtn = document.getElementById("startBtn");
  const resetBtn = document.getElementById("resetBtn");

  let enabled = false;
  let isDown = false;
  const brushRadius = 24;
  const finishAt = 0.55;

  function setBackground(){
    stage.style.backgroundImage = `url('${IMAGE_URL}')`;
    stage.style.backgroundSize = "cover";
    stage.style.backgroundPosition = "center";
  }

  function setupCanvas(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);

    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const g = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
    g.addColorStop(0,"#d2d2da");
    g.addColorStop(1,"#9aa0aa");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `${Math.floor(canvas.width/14)}px system-ui, sans-serif`;
    ctx.fillText("Scratch here", canvas.width/2, canvas.height/2);

    overlayEl.classList.remove("show");
    resultText.classList.remove("show");
  }

  function resetAll(){
    enabled = false;
    hintEl.textContent = "Press Start";
    countdownEl.style.display = "none";
    resultText.classList.remove("show");
    setBackground();
    setupCanvas();
  }

  function startCountdown(){
    enabled = false;
    let n = 3;
    countdownEl.style.display = "block";
    countdownEl.textContent = n;
    hintEl.textContent = "Get ready…";

    const timer = setInterval(()=>{
      n--;
      if(n<=0){
        clearInterval(timer);
        countdownEl.style.display = "none";
        enabled = true;
        hintEl.textContent = "Scratch the screen!";
      } else {
        countdownEl.textContent = n;
      }
    },900);
  }

  function scratchAt(cx, cy){
    if(!enabled) return;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const x = (cx - rect.left) * dpr;
    const y = (cy - rect.top) * dpr;

    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(x, y, brushRadius*dpr, 0, Math.PI*2);
    ctx.fill();
  }

  function clearedRatio(){
    const w = canvas.width, h = canvas.height;
    const step = 10;
    const data = ctx.getImageData(0,0,w,h).data;
    let cleared=0, total=0;
    for(let y=0;y<h;y+=step){
      for(let x=0;x<w;x+=step){
        const a = data[(y*w+x)*4+3];
        total++;
        if(a===0) cleared++;
      }
    }
    return cleared/total;
  }

  function maybeFinish(){
    if(!enabled) return;
    if(clearedRatio() >= finishAt){
      overlayEl.classList.add("show");
      resultText.classList.add("show");
      hintEl.textContent = "It’s a BOY!";
    }
  }

  canvas.addEventListener("pointerdown", e=>{
    if(!enabled) return;
    isDown = true;
    scratchAt(e.clientX, e.clientY);
  });
  canvas.addEventListener("pointermove", e=>{
    if(!isDown) return;
    e.preventDefault();
    scratchAt(e.clientX, e.clientY);
  }, {passive:false});
  canvas.addEventListener("pointerup", ()=>{
    if(!isDown) return;
    isDown=false;
    maybeFinish();
  });
  canvas.addEventListener("pointercancel", ()=> isDown=false);

  startBtn.onclick = ()=>{ resetAll(); startCountdown(); };
  resetBtn.onclick = resetAll;

  window.addEventListener("resize", setupCanvas);

  const img = new Image();
  img.onload = resetAll;
  img.onerror = ()=>{
    setBackground(); setupCanvas();
    hintEl.textContent = "Image not found (check assets/ultrasound.jpg)";
  };
  img.src = IMAGE_URL;
})();
</script>

</body>
</html>
