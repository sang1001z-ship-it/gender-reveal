<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gender Reveal</title>
  <style>
    :root { --cardW: min(92vw, 420px); }
    body{
      margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
      background:#0b0b10; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      padding:18px;
    }
    .wrap{ width: var(--cardW); text-align:center; }
    h1{ margin: 0 0 10px; font-size: 22px; font-weight: 800; letter-spacing: .2px;}
    .sub{ opacity:.85; margin:0 0 14px; font-size: 14px; line-height: 1.4;}
    .panel{
      border-radius: 18px; overflow:hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,.45);
      background: #12121a;
      border: 1px solid rgba(255,255,255,.08);
    }
    .stage{
      position:relative; width:100%;
      aspect-ratio: 4 / 3; /* 사진 비율이 다르면 자동으로 맞춰짐 */
      background:#000;
    }
    canvas{
      width:100%; height:100%; display:block;
      touch-action: none; /* 모바일 스크롤 방지 */
    }
    .overlay{
      position:absolute; inset:0; display:flex; justify-content:center; align-items:center;
      background: rgba(0,0,0,.35);
      opacity:0; pointer-events:none;
      transition: opacity .2s ease;
      font-size: 64px; font-weight: 900; letter-spacing: 2px;
      text-shadow: 0 12px 28px rgba(0,0,0,.55);
    }
    .overlay.show{ opacity:1; }
