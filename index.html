<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gender Reveal</title>

  <style>
    :root { --max: 440px; }
    body{
      margin:0; min-height:100vh;
      display:flex; justify-content:center; align-items:center;
      background:#0b0b10; color:#fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      padding:18px;
    }
    .wrap{ width:min(92vw, var(--max)); text-align:center; }
    h1{ margin:0 0 8px; font-size:22px; font-weight:900; letter-spacing:.2px; }
    .sub{ margin:0 0 14px; font-size:14px; opacity:.85; line-height:1.4; }

    .card{
      background:#12121a;
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 16px 50px rgba(0,0,0,.45);
    }

    .topbar{
      padding:12px 14px 6px;
    }
    .countdown{
      font-size:44px; font-weight:900;
      display:none;
    }
    .hint{
      font-size:13px; opacity:.85;
      padding-bottom:8px;
    }

    .stage{
      position:relative;
      width:100%;
      aspect-ratio: 4 / 3;
      background:#000;
      /* 아래에서 JS로 background-image를 세팅 */
    }
    canvas{
      width:100%;
      height:100%;
      display:block;
      touch-action:none; /* 모바일에서 스크롤/줌 방지 */
    }

    .overlay{
      position:absolute; inset:0;
      display:flex; justify-content:center; align-items:center;
      font-size:64px; font-weight:900;
      background:rgba(0,0,0,.25);
      opacity:0; pointer-events:none;
      transition:opacity .25s ease;
      text-shadow:0 12px 28px rgba(0,0,0,.55);
    }
    .overlay.show{ opacity:1; }

    .controls{
      display:flex; gap:10px;
      justify-content:center;
      padding:14px;
    }
    button{
      border:0; border-radius:12px;
      padding:12px 14px;
      font-size:15px; font-weight:900;
      cursor:pointer;
      color:#fff;
      background:#2a6bff;
    }
    button.secondary{
      background:rgba(255,255,255,.12);
    }

    .foot{ margin-top:10px; font-size:12px; opacity:.65; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Gender Reveal</h1>
    <p class="sub">Start를 누르면 카운트다운 후, 화면을 손가락으로 긁을 수 있어요 👶✨</p>

    <div class="card">
      <div class="topbar">
        <div class="countdown" id="countdown">3</div>
        <div class="hint" id="hint">Start를 눌러주세요</div>
      </div>

      <div class="stage" id="stage">
        <canvas id="scratch"></canvas>
        <div class="overlay" id="overlay">🎉</div>
      </div>

      <div class="controls">
        <button id="startBtn">Start</button>
        <button class="secondary" id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="foot">※ 공개 링크라면 초음파 이미지 상단 개인정보는 미리 크롭/가림 추천</div>
  </div>

<script>
(() => {
  // ✅ 초음파 이미지 경로 (파일명/대소문자 정확히!)
  const REVEAL_IMAGE_URL = "assets/ultrasound.jpg";

  const canvas = document.getElementById("scratch");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  const stage = document.getElementById("stage");
  const countdownEl = document.getElementById("countdown");
  const hintEl = document.getElementById("hint");
  const overlayEl = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const resetBtn = document.getElementById("resetBtn");

  let enabled = false;
  let isDown = false;
  const brushRadius = 24;      // 긁는 굵기
  const finishAt = 0.55;       // 55% 이상 지우면 완료 처리

  // 배경으로 이미지 세팅(긁으면 보이게)
  function setBackground() {
    stage.style.backgroundImage = `url('${REVEAL_IMAGE_URL}')`;
    stage.style.backgroundSize = "cover";
    stage.style.backgroundPosition = "center";
  }

  // 캔버스를 화면 크기에 맞추고 덮개 다시 그리기
  function setupCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    canvas.width  = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));

    // 덮개(스크래치 레이어) 그리기
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    g.addColorStop(0, "#d2d2da");
    g.addColorStop(1, "#9aa0aa");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 안내 글자
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `${Math.floor(canvas.width / 14)}px system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, sans-serif`;
    ctx.fillText("여기를 긁어보세요", canvas.width / 2, canvas.height / 2);

    overlayEl.classList.remove("show");
  }

  function resetAll() {
    enabled = false;
    hintEl.textContent = "Start를 눌러주세요";
    countdownEl.style.display = "none";
    setBackground();
    setupCanvas();
  }

  function startCountdown() {
    enabled = false;
    overlayEl.classList.remove("show");

    let n = 3;
    countdownEl.style.display = "block";
    countdownEl.textContent = n;
    hintEl.textContent = "준비 중…";

    const timer = setInterval(() => {
      n--;
      if (n <= 0) {
        clearInterval(timer);
        countdownEl.style.display = "none";
        enabled = true;
        hintEl.textContent = "손가락(또는 마우스)으로 드래그해서 긁어보세요!";
      } else {
        countdownEl.textContent = n;
      }
    }, 900);
  }

  function scratchAt(clientX, clientY) {
    if (!enabled) return;

    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const x = (clientX - rect.left) * dpr;
    const y = (clientY - rect.top) * dpr;

    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(x, y, brushRadius * dpr, 0, Math.PI * 2);
    ctx.fill();
  }

  function clearedRatio() {
    const w = canvas.width, h = canvas.height;
    const step = 10; // 성능/정확도 균형
    const data = ctx.getImageData(0, 0, w, h).data;

    let cleared = 0, total = 0;
    for (let y = 0; y < h; y += step) {
      for (let x = 0; x < w; x += step) {
        const a = data[(y * w + x) * 4 + 3];
        total++;
        if (a === 0) cleared++;
      }
    }
    return cleared / total;
  }

  function maybeFinish() {
    if (!enabled) return;
    const p = clearedRatio();
    if (p >= finishAt) {
      overlayEl.classList.add("show");
      hintEl.textContent = "완료! 🎉";
    }
  }

  // 포인터 이벤트(마우스/터치 모두 안정적으로 처리)
  function onPointerDown(e) {
    if (!enabled) return;
    isDown = true;
    canvas.setPointerCapture?.(e.pointerId);
    scratchAt(e.clientX, e.clientY);
  }
  function onPointerMove(e) {
    if (!isDown) return;
    e.preventDefault();
    scratchAt(e.clientX, e.clientY);
  }
  function onPointerUp() {
    if (!isDown) return;
    isDown = false;
    maybeFinish();
  }

  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove, { passive: false });
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerUp);

  startBtn.addEventListener("click", () => {
    resetAll();
    startCountdown();
  });
  resetBtn.addEventListener("click", resetAll);

  window.addEventListener("resize", () => {
    // 리사이즈하면 덮개 다시 그리기 (진행도는 초기화됨)
    const wasEnabled = enabled;
    setupCanvas();
    enabled = wasEnabled;
  });

  // 이미지 로드 확인(경로가 틀리면 안내)
  const testImg = new Image();
  testImg.onload = resetAll;
  testImg.onerror = () => {
    setBackground();
    setupCanvas();
    hintEl.textContent = "이미지를 못 불러왔어요: assets/ultrasound.jpg 경로/파일명 확인!";
  };
  testImg.src = REVEAL_IMAGE_URL;
})();
</script>

</body>
</html>
